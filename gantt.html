<style>*{margin:0;padding:0;box-sizing:border-box}

.theme-paper{--bg:#faf7f0;--surface:#fff;--border:#e6ddd0;--text:#2c2416;--text-secondary:#8a7f6e;--accent:#8b6914;--green:#1a7a3a;--yellow:#b8860b;--red:#b91c1c}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:8px}
.header h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.header .subtitle{color:var(--text-secondary);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:600;color:var(--text);margin-bottom:12px}
.card h3{font-size:14px;font-weight:600;color:var(--text);margin:16px 0 10px;padding-top:10px;border-top:1px solid var(--border)}
.card h3:first-of-type{border-top:none;padding-top:0;margin-top:0}
.table-wrap{width:100%;overflow-x:auto;margin-bottom:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td{padding:7px 10px;border-bottom:1px solid rgba(42,45,58,.25);font-size:13px}
tr:last-child td{border-bottom:none}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.owner{color:var(--text-secondary);font-size:12px}.num{font-weight:700;font-size:15px}
.num-red{color:var(--red)}.num-green{color:var(--green)}.num-yellow{color:var(--yellow)}.num-blue{color:var(--blue)}
.footer{text-align:center;color:var(--text-secondary);font-size:12px;padding:24px 0 12px;border-top:1px solid var(--border);margin-top:24px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-done{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.badge-progress{background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--blue)}
.badge-overdue{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.badge-blocked{background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--orange)}
.badge-planned{background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}
.badge-backlog{background:color-mix(in srgb,var(--text-secondary) 10%,transparent);color:var(--text-secondary)}
.badge-nobody{background:color-mix(in srgb,var(--red) 8%,transparent);color:var(--red)}
.alert{padding:10px 14px;border-radius:6px;margin:10px 0;font-size:13px;line-height:1.4}
.alert-danger{background:color-mix(in srgb,var(--red) 10%,transparent);border-left:3px solid var(--red)}
.alert-warning{background:color-mix(in srgb,var(--yellow) 10%,transparent);border-left:3px solid var(--yellow)}
.alert-success{background:color-mix(in srgb,var(--green) 10%,transparent);border-left:3px solid var(--green)}
.alert-info{background:color-mix(in srgb,var(--blue) 10%,transparent);border-left:3px solid var(--blue)}
.comment-box{padding:8px 12px;margin:6px 0;border-radius:6px;background:color-mix(in srgb,var(--accent) 6%,transparent);border-left:2px solid var(--accent);font-size:12px;line-height:1.4}
.comment-box .author{font-weight:600;color:var(--accent)}.comment-box .date{color:var(--text-secondary);font-size:11px;margin-left:6px}
.comment-box .highlight{background:color-mix(in srgb,var(--yellow) 15%,transparent);padding:0 4px;border-radius:3px}
.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.project-card{padding:20px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s}
.project-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.project-card h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
.project-card .stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.project-card .stat span{color:var(--text-secondary)}.project-card .stat .v{font-weight:700}
.project-card .atraso{color:var(--red)}.project-card .ok{color:var(--green)}.project-card .active{color:var(--blue)}
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi-item{flex:1;min-width:90px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;text-align:center}
.kpi-item .val{font-size:20px;font-weight:700}.kpi-item .label{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}

@media(max-width:640px){body{padding:12px}.card{padding:14px}td,th{font-size:11px;padding:5px 6px}.header h1{font-size:20px}.project-grid{grid-template-columns:1fr}.kpi-item{min-width:70px;padding:8px 10px}.kpi-item .val{font-size:16px}}

.gantt-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.gantt-wrap h2{font-size:16px;font-weight:600;color:var(--text);margin-bottom:12px}
.gantt-controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.gantt-controls select{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.gantt-controls .nav-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;transition:all .15s}
.gantt-controls .nav-btn:hover{border-color:var(--accent)}

.gantt-legend span{display:flex;align-items:center;gap:6px}
.gantt-legend .dot{width:12px;height:12px;border-radius:3px}
#gantt{overflow-x:auto;margin:16px 0}.gantt table{min-width:800px}
.detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px;display:none}
.detail-panel.visible{display:block}
.detail-panel h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.detail-panel table{width:100%;border-collapse:collapse}

.detail-panel .close-btn:hover{color:var(--text);border-color:var(--text)}

.bar-wrapper.active .bar{fill:var(--green)!important}

function show_detail(epic_key) {
  const data = CARDS[epic_key];
  if (!data) return;
  const p = document.getElementById('detailPanelContainer');
  let rows = '';
  for (const c of data.cards) {
    rows += `<tr><td>${c.key}</td><td>${c.summary}</td><td>${c.status}</td><td>${c.duedate}</td><td>${c.assignee}</td></tr>`;
  }
  p.innerHTML = `<div class="detail-panel visible">
    <button class="close-btn" onclick="this.parentElement.classList.remove('visible')">&times;</button>
    <h3>${data.project}: ${data.name} &mdash; ${data.cards.length} cards</h3>
    <div class="table-wrap"><table><thead><tr><th>Card</th><th>Atividade</th><th>Status</th><th>Prazo</th><th>Resp</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function task_bar_html(task) {
  const pct = task.progress || 0;
  const overdue = task.noverdue > 0 ? `<span style="color:#ef4444;font-weight:600;"> ${task.noverdue} vencidos</span>` : '';
  return `
    <div style="padding:6px 10px;font-size:12px;line-height:1.3;">
      <strong>${task.name}</strong><br>
      <span style="color:#8b8fa3;">${task.project} &middot; ${task.status}</span>
      <span style="margin-left:8px;">${pct}%</span>${overdue}
    </div>`;
}

    : SPRINTS;
  for (const s of filtered_sprints) {
    if (!s.startDate || !s.endDate) continue;
    const ss = new Date(s.startDate + 'T00:00:00');
    const se = new Date(s.endDate + 'T00:00:00');
    if (isNaN(ss) || isNaN(se)) continue;
    const x = (ss - st) / MS_H / step * cw;
    const w = Math.max(2, (se - ss) / MS_H / step * cw);
    var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', hdr);
    rect.setAttribute('width', w); rect.setAttribute('height', gh - hdr);
    rect.setAttribute('class', 'sprint-band ' + s.state);
    // Use direct fill/stroke attributes for reliable rendering
    if (s.state === 'active') {
      rect.setAttribute('fill', '#3b82f6');
      rect.setAttribute('opacity', '0.5');
      rect.setAttribute('stroke', '#93c5fd');
      rect.setAttribute('stroke-width', '2');
    } else if (s.state === 'closed') {
      rect.setAttribute('fill', '#22c55e');
      rect.setAttribute('opacity', '0.35');
      rect.setAttribute('stroke', '#86efac');
      rect.setAttribute('stroke-width', '1');
    } else {
      rect.setAttribute('fill', '#6366f1');
      rect.setAttribute('opacity', '0.35');
      rect.setAttribute('stroke', '#a5b4fc');
      rect.setAttribute('stroke-width', '1');
      rect.setAttribute('stroke-dasharray', '4,3');
    }
    gridLayer.appendChild(rect);
    if (s.state === 'active') {
      var lb = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lb.setAttribute('x', x + 4); lb.setAttribute('y', hdr - 10);
      lb.setAttribute('class', 'sprint-label');
      lb.textContent = s.name;
      gridLayer.appendChild(lb);
    }
  }
}

function filter_project(name) {
  // Update button active state
  document.querySelectorAll('.proj-btn').forEach(function(b) {
    b.classList.remove('proj-btn-active');
    b.style.background = b.style.border = '';
    if (b.textContent === 'Todos') {
      b.style.background = ''; b.style.color = ''; b.style.border = '';
    }
  });
  // Filter tasks
  var filtered = name ? TASKS.filter(function(t) { return t.project === name; }) : TASKS;
  var count = filtered.length;
  
  // Update legend visibility
  document.querySelectorAll('.gantt-legend span').forEach(function(s) {
    s.style.display = (name && !s.textContent.includes(name)) ? 'none' : '';
  });
  
  // Find all project buttons and highlight the active one
  document.querySelectorAll('.proj-btn').forEach(function(b) {
    if ((name && b.textContent === name) || (!name && b.textContent === 'Todos')) {
      b.style.background = 'var(--accent)';
      b.style.color = '#fff';
      b.style.border = 'none';
      b.style.fontWeight = '600';
    }
  });
  
  currentFilter = name;
  document.querySelector('#gantt').innerHTML = '';
  gantt = new Gantt('#gantt', filtered, {
    view_mode: 'Month',
    date_format: 'YYYY-MM-DD',
    bar_height: 32,
    on_click: function(task) { show_detail(task.id); },
    custom_popup_html: function(task) { return task_bar_html(task); },
    on_view_change: function() { render_sprint_bands(); }
  });
  render_sprint_bands();
  
  // Update epic count
  var counter = document.querySelector('.gantt-controls span:last-child');
  if (counter) counter.textContent = count + ' épicos' + (name ? ' — ' + name : '');
}

var currentFilter = null;
var gantt = new Gantt('#gantt', TASKS, {
  view_mode: 'Month',
  date_format: 'YYYY-MM-DD',
  bar_height: 32,
  on_click: function(task) { show_detail(task.id); },
  custom_popup_html: function(task) { return task_bar_html(task); },
  on_view_change: function() { render_sprint_bands(); }
});
render_sprint_bands();
</script>
