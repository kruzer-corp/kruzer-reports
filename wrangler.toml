name = "kruzer-dashboards"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# ─── Config base (vale pra `wrangler deploy` sem --env, que é o atual prod) ───
# Serve arquivos estáticos do public/ via binding ASSETS.
# html_handling = "auto-trailing-slash" garante que /krzr/ → krzr/index.html
# e /krzr/hml → krzr/hml.html (sem precisar do .html no link).
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# run_worker_first = true faz TODO request passar pelo worker antes de servir
# o asset. Sem isso, a Cloudflare serve o HTML direto (asset-first), e o gate de
# Basic Auth do worker nunca roda pras páginas — só pra /api/*. Com isso, o worker
# autentica primeiro e só então chama env.ASSETS.fetch().
run_worker_first = true

# Logs durante desenvolvimento
[observability]
enabled = true

# ─── D1 prod (Camada 1 do roadmap de controle de operação) ─────────────────────
# Estado vivo compartilhado: remarks, followups, cenários de capacity, schedule
# publicado e config de risco. Substitui o localStorage por-navegador.
#
# Setup local (uma vez):
#   wrangler d1 create kruzer-state
#   # copie o database_id de saída pro campo abaixo
#   wrangler d1 execute kruzer-state --file=migrations/0001_init.sql
#   wrangler d1 execute kruzer-state --file=migrations/0001_init.sql --remote
[[d1_databases]]
binding = "STATE_DB"
database_name = "kruzer-state"
database_id = "0c3d7647-3d53-41fa-b6a6-ac244659a8b2"

# ─── KV prod — store do OAuthProvider (clients/grants/tokens do MCP) ────────────
# Usado por @cloudflare/workers-oauth-provider. Secret OAUTH_USERS (JSON de
# allowlist email/senha/nome) autentica no /authorize. Ver src/oauth.js.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "fc0c1f8d165b4ab6a830aa057491c362"

# ═══════════════════════════════════════════════════════════════════════════════
# Environment: HML (homologação)
# URL: https://kruzer-dashboards-hml.matheus-mereb.workers.dev
# D1 isolado: kruzer-state-hml (não compartilha dado com prod)
# Deploy: `npm run deploy:hml`  (ou `wrangler deploy --env hml`)
# ═══════════════════════════════════════════════════════════════════════════════
[env.hml]
name = "kruzer-dashboards-hml"

[env.hml.assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[env.hml.observability]
enabled = true

[[env.hml.d1_databases]]
binding = "STATE_DB"
database_name = "kruzer-state-hml"
database_id = "840c3739-067b-4a39-9ec7-d5c4add50638"

[[env.hml.kv_namespaces]]
binding = "OAUTH_KV"
id = "2fa130bc2fc54e6eb0ba7cd86b5a10bc"
